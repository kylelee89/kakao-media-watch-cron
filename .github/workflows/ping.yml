name: 카카오 언론보도 수집 트리거

# 10분마다 Vercel 수집 API 를 깨운다.
# 이 저장소에는 코드도 수집 데이터도 없다. 스케줄러 역할만 한다.
# 대상 주소는 저장소 시크릿 WATCH_URL 에 있어서 공개 저장소여도 노출되지 않는다.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: kmw-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 수집 API 호출
        env:
          WATCH_URL: ${{ secrets.WATCH_URL }}
        run: |
          if [ -z "$WATCH_URL" ]; then
            echo "::error::WATCH_URL 시크릿이 설정되지 않았습니다."
            exit 1
          fi
          # 콜드스타트 대비로 넉넉히 기다리고, 실패하면 두 번 더 시도한다.
          for i in 1 2 3; do
            curl -s -m 120 --fail "$WATCH_URL" -o resp.json && break
            echo "시도 $i 실패, 15초 후 재시도"
            sleep 15
          done
          if [ ! -s resp.json ]; then echo "::error::수집 API 호출 실패"; exit 1; fi
          # 결과 요약만 로그에 남긴다 (기사 제목이나 본문은 남기지 않는다)
          python3 - resp.json <<'PYEOF'
          import json, sys, collections
          d = json.load(open(sys.argv[1], encoding='utf-8'))
          a = d.get('articles', [])
          t = collections.Counter(x.get('tone') for x in a)
          print('누적 %d건 | 신규 %s | source %s | 저장 %s'
                % (len(a), d.get('collected'), d.get('source'), d.get('persisted')))
          print('  긍정 %d 중립 %d 우려 %d' % (t.get('긍정', 0), t.get('중립', 0), t.get('우려', 0)))
          if d.get('error'):
              print('  API error:', d['error'])
          PYEOF
